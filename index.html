<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>BrasilTvLive — Ao vivo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Android TV 9 may ship Chromium 66. Keep the shared React bundle
      // usable there without changing the application UI or state model.
      if (!Object.fromEntries) {
        Object.fromEntries = function (entries) {
          return entries.reduce(function (result, entry) {
            result[entry[0]] = entry[1];
            return result;
          }, {});
        };
      }
      if (!window.globalThis) window.globalThis = window;
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
